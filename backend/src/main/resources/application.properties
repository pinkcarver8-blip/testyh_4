server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:0000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 프론트엔드 주소 (쉼표로 구분, 와일드카드 패턴 가능)
app.cors.allowed-origin-patterns=${CORS_ORIGINS:http://localhost:5173,https://*.vercel.app}
